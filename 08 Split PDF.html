<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Split PDF – Tool Kit</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- PDF.js for preview -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
    </script>
    <!-- pdf-lib for splitting -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js">
    </script>

    <style>
        /* ─────────── Reset & Base ─────────── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --bg-start: #f0f4fe;
            --bg-end: #d9e2ef;
            --surface: rgba(255, 255, 255, 0.72);
            --surface-solid: #ffffff;
            --text-primary: #0a1628;
            --text-secondary: #334155;
            --text-muted: #94a3b8;
            --border-light: rgba(255, 255, 255, 0.50);
            --border-solid: #e8edf5;
            --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 40px rgba(0, 0, 0, 0.07);
            --shadow-lg: 0 30px 60px -20px rgba(0, 0, 0, 0.30);
            --shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.10);
            --radius: 24px;
            --radius-sm: 16px;
            --radius-xs: 12px;
            --transition: 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            --gradient-primary: linear-gradient(135deg, #2563eb, #7c3aed);
            --gradient-btn: linear-gradient(135deg, #4f46e5, #6366f1);
            --gradient-success: linear-gradient(135deg, #10b981, #059669);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background: linear-gradient(145deg, var(--bg-start) 0%, var(--bg-end) 100%);
            padding: 1.5rem;
            animation: bgPulse 14s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% {
                background: linear-gradient(145deg, #f0f4ff 0%, #d9e2ef 100%);
            }
            100% {
                background: linear-gradient(145deg, #e8edfa 0%, #c8d6e8 100%);
            }
        }

        .app-wrapper {
            max-width: 1300px;
            width: 100%;
        }

        /* ─────────── Header ─────────── */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
            padding: 18px 28px;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md), 0 0 0 1px var(--border-light) inset;
            transition: var(--transition);
        }

        .app-header:hover {
            box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255, 255, 255, 0.7) inset;
        }

        .app-header .logo-area {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .app-header .logo-icon {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 22px;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.25);
            flex-shrink: 0;
        }

        .app-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.03em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-header h1 .highlight {
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .app-header .badge-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header-badge {
            background: #dbeafe;
            color: #1e4f8a;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.10);
        }

        .header-badge i {
            font-size: 13px;
        }

        .header-badge.private {
            background: #dcfce7;
            color: #15803d;
        }

        /* ─────────── Main Grid ─────────── */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 360px;
            gap: 28px;
            margin-top: 6px;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
                gap: 24px;
            }
        }

        /* ─────────── Panels ─────────── */
        .panel {
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius);
            padding: 26px 28px 28px;
            box-shadow: var(--shadow-md), 0 0 0 1px var(--border-light) inset;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .panel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--gradient-primary);
            opacity: 0.3;
        }

        .panel:hover {
            box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255, 255, 255, 0.7) inset;
        }

        .panel-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -0.2px;
        }

        .panel-title i {
            color: #2563eb;
            font-size: 18px;
        }

        .panel-title .badge-count {
            background: #eef2f9;
            font-size: 13px;
            font-weight: 600;
            padding: 0 14px;
            border-radius: 30px;
            color: var(--text-secondary);
            line-height: 26px;
            font-feature-settings: "tnum";
        }

        /* ─────────── Upload Zone ─────────── */
        .upload-zone {
            border: 2px dashed #cbd5e1;
            border-radius: var(--radius-sm);
            padding: 28px 20px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: rgba(255, 255, 255, 0.20);
            position: relative;
            animation: dropPulse 3s ease-in-out infinite;
        }

        @keyframes dropPulse {
            0%,
            100% {
                border-color: #cbd5e1;
            }
            50% {
                border-color: #a5b4fc;
            }
        }

        .upload-zone:hover {
            border-color: #818cf8;
            background: rgba(129, 140, 248, 0.08);
            transform: scale(1.01);
            animation: none;
        }

        .upload-zone.dragover {
            border-color: #4f46e5;
            background: rgba(79, 70, 229, 0.12);
            transform: scale(1.025);
            box-shadow: 0 0 0 6px rgba(79, 70, 229, 0.08);
            animation: none;
        }

        .upload-zone .icon-wrap {
            font-size: 40px;
            line-height: 1;
            margin-bottom: 6px;
            display: inline-block;
            color: #4f46e5;
            animation: floatIcon 4s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        .upload-zone .label {
            font-weight: 500;
            color: var(--text-primary);
            font-size: 15px;
        }

        .upload-zone .label strong {
            color: #4f46e5;
            font-weight: 600;
        }

        .upload-zone .hint {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .upload-zone .hint i {
            color: #10b981;
            margin-right: 4px;
        }

        .upload-zone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        /* ─────────── File Info ─────────── */
        .file-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 14px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: var(--radius-xs);
            flex-wrap: wrap;
        }

        .file-info .fi-icon {
            font-size: 24px;
            color: #2563eb;
        }

        .file-info .fi-name {
            font-weight: 600;
            color: var(--text-primary);
            font-size: 14px;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-info .fi-size {
            font-size: 13px;
            color: var(--text-muted);
        }

        .file-info .fi-pages {
            background: #eef2f9;
            padding: 0 12px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            line-height: 28px;
            color: var(--text-secondary);
        }

        /* ─────────── Split Options ─────────── */
        .split-options {
            margin-top: 18px;
        }

        .option-group {
            margin-bottom: 16px;
        }

        .option-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 6px;
        }

        .option-group select,
        .option-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: var(--radius-xs);
            font-size: 14px;
            font-weight: 500;
            transition: all 0.25s ease;
            font-family: var(--font);
            background: rgba(255, 255, 255, 0.6);
            color: var(--text-primary);
        }

        .option-group select:focus,
        .option-group input:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.12);
            background: #fff;
        }

        .option-group .hint-text {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .option-group .hint-text i {
            margin-right: 4px;
        }

        .mode-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .mode-selector .mode-btn {
            flex: 1;
            min-width: 60px;
            padding: 8px 12px;
            border-radius: var(--radius-xs);
            border: 1.5px solid var(--border-solid);
            background: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            transition: all 0.25s ease;
            text-align: center;
            font-weight: 600;
            font-size: 13px;
            font-family: var(--font);
            color: var(--text-secondary);
        }

        .mode-selector .mode-btn:hover {
            background: rgba(255, 255, 255, 0.6);
        }

        .mode-selector .mode-btn.active {
            border-color: #8b5cf6;
            background: rgba(139, 92, 246, 0.10);
            color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.08);
        }

        .mode-selector .mode-btn i {
            display: block;
            font-size: 18px;
            margin-bottom: 2px;
        }

        /* ─────────── Preview / Page List ─────────── */
        .page-preview-list {
            max-height: 300px;
            overflow-y: auto;
            margin-top: 12px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: var(--radius-xs);
            padding: 8px;
            display: none;
        }

        .page-preview-list.visible {
            display: block;
        }

        .page-preview-list::-webkit-scrollbar {
            width: 5px;
        }
        .page-preview-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .page-preview-list::-webkit-scrollbar-thumb {
            background: #d0d9e8;
            border-radius: 10px;
        }

        .page-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 10px;
            border-radius: 8px;
            transition: background 0.2s;
            cursor: default;
        }

        .page-item:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        .page-item .page-number {
            font-weight: 600;
            font-size: 13px;
            color: var(--text-primary);
            min-width: 32px;
        }

        .page-item .page-thumb {
            width: 40px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
            background: #e2e8f0;
            border: 1px solid var(--border-solid);
        }

        .page-item .page-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-left: auto;
        }

        /* ─────────── Action Buttons ─────────── */
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 20px;
            background: var(--gradient-btn);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 20px rgba(79, 70, 229, 0.30);
            font-family: var(--font);
            position: relative;
            overflow: hidden;
        }

        .btn-primary::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #818cf8, #4f46e5);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .btn-primary:hover:not(:disabled)::after {
            opacity: 1;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 8px 32px rgba(79, 70, 229, 0.40);
        }

        .btn-primary:active:not(:disabled) {
            transform: scale(0.97);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .btn-primary .btn-text,
        .btn-primary .spinner {
            position: relative;
            z-index: 1;
        }

        .btn-primary .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            flex-shrink: 0;
        }

        .btn-primary.loading .spinner {
            display: inline-block;
        }

        .btn-primary.loading .btn-text {
            opacity: 0.8;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn-success {
            background: var(--gradient-success);
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.30);
        }

        .btn-success:hover:not(:disabled) {
            box-shadow: 0 8px 32px rgba(16, 185, 129, 0.40);
        }

        .btn-success::after {
            background: linear-gradient(135deg, #34d399, #059669);
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 18px;
        }

        /* ─────────── Download button ─────────── */
        .download-section {
            margin-top: 12px;
            display: none;
        }

        .download-section.visible {
            display: block;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .download-section .btn-download {
            width: 100%;
            padding: 14px 20px;
            border-radius: var(--radius-sm);
            border: none;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: var(--font);
            background: var(--gradient-success);
            color: #fff;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.30);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .download-section .btn-download:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 8px 32px rgba(16, 185, 129, 0.40);
        }

        .download-section .btn-download:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .download-section .btn-download .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .download-section .btn-download.loading .spinner {
            display: inline-block;
        }

        .download-section .btn-download.loading .btn-text {
            opacity: 0.8;
        }

        .download-section .info-text {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            margin-top: 8px;
        }

        /* ─────────── Status ─────────── */
        .info-box {
            background: rgba(255, 255, 255, 0.3);
            border-radius: var(--radius-xs);
            padding: 14px 16px;
            margin-bottom: 14px;
        }

        .info-box .ib-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
