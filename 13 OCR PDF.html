<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF to OCR – Extract Text from Scanned Documents</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- PDF.js for rendering pages -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
    </script>

    <!-- Tesseract.js for OCR (v4) -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js">
    </script>

    <style>
        /* ─────────── Reset & Base (matching existing design) ─────────── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --bg-start: #f0f4fe;
            --bg-end: #d9e2ef;
            --surface: rgba(255, 255, 255, 0.72);
            --surface-solid: #ffffff;
            --text-primary: #0a1628;
            --text-secondary: #334155;
            --text-muted: #94a3b8;
            --border-light: rgba(255, 255, 255, 0.50);
            --border-solid: #e8edf5;
            --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 40px rgba(0, 0, 0, 0.07);
            --shadow-lg: 0 30px 60px -20px rgba(0, 0, 0, 0.30);
            --shadow-xl: 0 20px 60px rgba(0, 0, 0, 0.10);
            --radius: 24px;
            --radius-sm: 16px;
            --radius-xs: 12px;
            --transition: 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            --gradient-primary: linear-gradient(135deg, #2563eb, #7c3aed);
            --gradient-btn: linear-gradient(135deg, #4f46e5, #6366f1);
            --gradient-success: linear-gradient(135deg, #10b981, #059669);
        }

        body {
            font-family: var(--font);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background: linear-gradient(145deg, var(--bg-start) 0%, var(--bg-end) 100%);
            padding: 1.5rem;
            animation: bgPulse 14s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% { background: linear-gradient(145deg, #f0f4ff 0%, #d9e2ef 100%); }
            100% { background: linear-gradient(145deg, #e8edfa 0%, #c8d6e8 100%); }
        }

        .app-wrapper {
            max-width: 1100px;
            width: 100%;
        }

        /* ─────────── Header ─────────── */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
            padding: 18px 28px;
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md), 0 0 0 1px var(--border-light) inset;
            transition: var(--transition);
        }
        .app-header:hover {
            box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255,255,255,0.7) inset;
        }
        .app-header .logo-area {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .app-header .logo-icon {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 22px;
            box-shadow: 0 4px 16px rgba(37,99,235,0.25);
            flex-shrink: 0;
        }
        .app-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.03em;
        }
        .app-header h1 .highlight {
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .header-badge {
            background: #dbeafe;
            color: #1e4f8a;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(37,99,235,0.10);
        }
        .header-badge i { font-size: 13px; }
        .header-badge.private {
            background: #dcfce7;
            color: #15803d;
        }

        /* ─────────── Main Grid ─────────── */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            margin-top: 6px;
        }
        @media (max-width: 900px) {
            .main-grid { grid-template-columns: 1fr; gap: 24px; }
        }

        /* ─────────── Panels ─────────── */
        .panel {
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius);
            padding: 26px 28px 28px;
            box-shadow: var(--shadow-md), 0 0 0 1px var(--border-light) inset;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        .panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: var(--gradient-primary);
            opacity: 0.3;
        }
        .panel:hover {
            box-shadow: var(--shadow-lg), 0 0 0 1px rgba(255,255,255,0.7) inset;
        }
        .panel-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -0.2px;
        }
        .panel-title i { color: #2563eb; font-size: 18px; }
        .badge-count {
            background: #eef2f9;
            font-size: 13px;
            font-weight: 600;
            padding: 0 14px;
            border-radius: 30px;
            color: var(--text-secondary);
            line-height: 26px;
            font-feature-settings: "tnum";
        }

        /* ─────────── Upload Zone ─────────── */
        .upload-zone {
            border: 2px dashed #cbd5e1;
            border-radius: var(--radius-sm);
            padding: 30px 20px 26px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: rgba(255,255,255,0.20);
            position: relative;
            animation: dropPulse 3s ease-in-out infinite;
        }
        @keyframes dropPulse {
            0%,100% { border-color: #cbd5e1; }
            50% { border-color: #a5b4fc; }
        }
        .upload-zone:hover {
            border-color: #818cf8;
            background: rgba(129,140,248,0.08);
            transform: scale(1.01);
            animation: none;
        }
        .upload-zone.dragover {
            border-color: #4f46e5;
            background: rgba(79,70,229,0.12);
            transform: scale(1.025);
            box-shadow: 0 0 0 6px rgba(79,70,229,0.08);
            animation: none;
        }
        .upload-zone .icon-wrap {
            font-size: 40px;
            line-height: 1;
            margin-bottom: 6px;
            display: inline-block;
            color: #4f46e5;
            animation: floatIcon 4s ease-in-out infinite;
        }
        @keyframes floatIcon {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .upload-zone .label {
            font-weight: 500;
            color: var(--text-primary);
            font-size: 15px;
        }
        .upload-zone .label strong { color: #4f46e5; font-weight: 600; }
        .upload-zone .hint {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .upload-zone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .file-info {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: #ecfdf5;
            border-radius: var(--radius-sm);
            margin-top: 10px;
            border: 1px solid #a7f3d0;
            flex-wrap: wrap;
        }
        .file-info.show { display: flex; }
        .file-info .fi-icon { font-size: 28px; flex-shrink: 0; }
        .file-info .fi-details { flex: 1; min-width: 120px; }
        .file-info .fi-name { font-weight: 600; font-size: 0.9rem; word-break: break-all; }
        .file-info .fi-meta { font-size: 0.78rem; color: #065f46; }

        /* ─────────── Controls ─────────── */
        .control-group {
            margin-top: 18px;
        }
        .control-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        .control-label i { color: #2563eb; font-size: 14px; }
        input, select, textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #e2e8f0;
            border-radius: var(--radius-xs);
            font-size: 14px;
            font-weight: 500;
            transition: all 0.25s ease;
            font-family: var(--font);
            background: rgba(255,255,255,0.6);
            color: var(--text-primary);
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #8b5cf6;
            box-shadow: 0 0 0 4px rgba(139,92,246,0.12);
            background: #fff;
        }
        textarea {
            resize: vertical;
            min-height: 150px;
            font-size: 14px;
        }
        .input-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .input-row .field { flex: 1; min-width: 100px; }

        /* Progress bar */
        .progress-container {
            display: none;
            background: #e2e8f0;
            border-radius: 20px;
            height: 8px;
            overflow: hidden;
            margin-top: 12px;
        }
        .progress-container.show { display: block; }
        .progress-bar {
            height: 100%;
            background: var(--gradient-primary);
            width: 0%;
            border-radius: 20px;
            transition: width 0.3s ease;
        }

        /* ─────────── Buttons ─────────── */
        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 20px;
            background: var(--gradient-btn);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 20px rgba(79,70,229,0.30);
            font-family: var(--font);
            position: relative;
            overflow: hidden;
        }
        .btn-primary::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #818cf8, #4f46e5);
            opacity: 0;
            transition: opacity 0.4s ease;
        }
        .btn-primary:hover:not(:disabled)::after { opacity: 1; }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 8px 32px rgba(79,70,229,0.40);
        }
        .btn-primary:active:not(:disabled) { transform: scale(0.97); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; transform: none; }
        .btn-primary .btn-text { position: relative; z-index: 1; }

        .btn-sm {
            padding: 6px 13px;
            font-size: 0.78rem;
            border-radius: 20px;
            font-weight: 550;
            border: 1.5px solid #e2e8f0;
            background: rgba(255,255,255,0.4);
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: var(--font);
            color: var(--text-secondary);
        }
        .btn-sm:hover { background: rgba(255,255,255,0.7); border-color: #8b5cf6; color: #4f46e5; }

        /* ─────────── Toast ─────────── */
        .notification-toast {
            position: fixed;
            bottom: 24px; right: 24px;
            background: var(--surface-solid);
            backdrop-filter: blur(16px);
            padding: 14px 24px;
            border-radius: 40px;
            box-shadow: var(--shadow-xl), 0 0 0 1px var(--border-light);
            font-weight: 600;
            font-size: 14px;
            color: var(--text-primary);
            z-index: 1000;
            animation: slideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.5);
        }
        .notification-toast i { font-size: 18px; }
        .notification-toast.success i { color: #10b981; }
        .notification-toast.error i { color: #ef4444; }
        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* ─────────── Footer ─────────── */
        .app-footer {
            margin-top: 28px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            border-top: 1px solid rgba(255,255,255,0.4);
            padding-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .app-footer span { display: inline-flex; align-items: center; gap: 6px; }
        .app-footer .dot { color: #cbd5e1; }

        @media (max-width: 640px) {
            .app-header { padding: 14px 16px; border-radius: 20px; }
            .app-header .logo-icon { width: 38px; height: 38px; font-size: 17px; }
            .app-header h1 { font-size: 18px; }
            .panel { padding: 18px 14px 20px; border-radius: 20px; }
            .upload-zone { padding: 20px 12px 18px; }
        }
    </style>
</head>
<body>
    <div class="app-wrapper">
        <!-- ═══════════════ HEADER ═══════════════ -->
        <header class="app-header">
            <div class="logo-area">
                <span class="logo-icon"><i class="fas fa-file-lines"></i></span>
                <h1>PDF <span class="highlight">to OCR</span></h1>
            </div>
            <div class="badge-group">
                <span class="header-badge"><i class="fas fa-magnifying-glass"></i> OCR · Text Extraction</span>
                <span class="header-badge private"><i class="fas fa-lock"></i> 100% local</span>
            </div>
        </header>

        <!-- ═══════════════ MAIN GRID ═══════════════ -->
        <div class="main-grid">
            <!-- ─── LEFT: Upload & Controls ─── -->
            <div class="panel">
                <div class="panel-title">
                    <i class="fas fa-upload"></i> Upload Scanned PDF
                </div>

                <!-- Upload Zone -->
                <div class="upload-zone" id="uploadZone">
                    <span class="icon-wrap"><i class="fas fa-file-pdf"></i></span>
                    <div class="label">Drop a scanned PDF here, or <strong>click to browse</strong></div>
                    <div class="hint"><i class="fas fa-check-circle"></i> Works best with clear, high‑resolution scans</div>
                    <input type="file" id="fileInput" accept=".pdf,application/pdf" />
                </div>

                <!-- File Info -->
                <div class="file-info" id="fileInfo">
                    <span class="fi-icon">📎</span>
                    <div class="fi-details">
                        <div class="fi-name" id="fileNameDisplay">—</div>
                        <div class="fi-meta" id="fileMetaDisplay">—</div>
                    </div>
                    <button class="btn-sm" id="btnChangeFile"><i class="fas fa-sync-alt"></i> Change</button>
                </div>

                <!-- Settings (shown after upload) -->
                <div id="settingsGroup" style="display:none;">
                    <div class="control-group">
                        <div class="control-label"><i class="fas fa-language"></i> Document Language</div>
                        <select id="langSelect">
                            <option value="eng" selected>English</option>
                            <option value="spa">Spanish</option>
                            <option value="fra">French</option>
                            <option value="deu">German</option>
                            <option value="ita">Italian</option>
                            <option value="por">Portuguese</option>
                            <option value="rus">Russian</option>
                            <option value="chi_sim">Chinese (Simplified)</option>
                            <option value="jpn">Japanese</option>
                            <option value="kor">Korean</option>
                        </select>
                    </div>

                    <div class="progress-container" id="progressContainer">
                        <div class="progress-bar" id="progressBar"></div>
                    </div>
                    <div style="margin-top:4px; font-size:0.8rem; color:var(--text-muted);" id="progressLabel"></div>

                    <div style="margin-top:20px;">
                        <button class="btn-primary" id="btnStartOCR">
                            <span class="btn-text"><i class="fas fa-play"></i> Start OCR Extraction</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- ─── RIGHT: Extracted Text & Download ─── -->
            <div class="panel">
                <div class="panel-title">
                    <i class="fas fa-align-left"></i> Extracted Text
                </div>
                <textarea id="resultText" readonly placeholder="Recognized text will appear here..."></textarea>
                <div style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap;">
                    <button class="btn-primary" id="btnDownloadText" disabled style="flex:1;">
                        <span class="btn-text"><i class="fas fa-download"></i> Download .txt</span>
                    </button>
                    <button class="btn-sm" id="btnCopyText" disabled style="flex:0 0 auto;">
                        <i class="fas fa-copy"></i> Copy
                    </button>
                </div>
            </div>
        </div>

        <!-- ═══════════════ FOOTER ═══════════════ -->
        <div class="app-footer">
            <span><i class="fas fa-file-lines"></i> PDF to OCR Tool</span>
            <span class="dot">·</span>
            <span><i class="fas fa-microchip"></i> All processing runs locally</span>
            <span class="dot">·</span>
            <span><i class="fas fa-lock"></i> Files never leave your device</span>
        </div>
    </div>

    <script>
        (function() {
            // DOM refs
            const uploadZone = document.getElementById('uploadZone');
            const fileInput = document.getElementById('fileInput');
            const fileInfo = document.getElementById('fileInfo');
            const fileNameDisplay = document.getElementById('fileNameDisplay');
            const fileMetaDisplay = document.getElementById('fileMetaDisplay');
            const btnChangeFile = document.getElementById('btnChangeFile');
            const settingsGroup = document.getElementById('settingsGroup');
            const langSelect = document.getElementById('langSelect');
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const progressLabel = document.getElementById('progressLabel');
            const btnStartOCR = document.getElementById('btnStartOCR');
            const resultText = document.getElementById('resultText');
            const btnDownloadText = document.getElementById('btnDownloadText');
            const btnCopyText = document.getElementById('btnCopyText');

            let pdfBytes = null;
            let pdfDoc = null;
            let totalPages = 0;
            let isProcessing = false;

            // Toast
            function showNotification(msg, type = 'success') {
                const existing = document.querySelector('.notification-toast');
                if (existing) existing.remove();
                const toast = document.createElement('div');
                toast.className = `notification-toast ${type}`;
                const icon = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle';
                toast.innerHTML = `<i class="fas ${icon}"></i> ${msg}`;
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 3000);
            }

            function resetAll() {
                pdfBytes = null;
                pdfDoc = null;
                totalPages = 0;
                fileInfo.classList.remove('show');
                uploadZone.style.display = '';
                settingsGroup.style.display = 'none';
                resultText.value = '';
                btnDownloadText.disabled = true;
                btnCopyText.disabled = true;
                progressContainer.classList.remove('show');
                progressBar.style.width = '0%';
                progressLabel.textContent = '';
            }

            // Load PDF and prepare for OCR
            async function loadPDF(file) {
                if (!file || file.type !== 'application/pdf') {
                    showNotification('⚠️ Please upload a valid PDF file', 'error');
                    return;
                }
                const arrayBuffer = await file.arrayBuffer();
                pdfBytes = new Uint8Array(arrayBuffer);
                try {
                    pdfDoc = await pdfjsLib.getDocument({ data: pdfBytes }).promise;
                    totalPages = pdfDoc.numPages;
                    fileNameDisplay.textContent = file.name;
                    fileMetaDisplay.textContent = `${totalPages} page${totalPages !== 1 ? 's' : ''} · ${(file.size/1024).toFixed(1)} KB`;
                    fileInfo.classList.add('show');
                    uploadZone.style.display = 'none';
                    settingsGroup.style.display = 'block';
                    progressContainer.classList.remove('show');
                    progressBar.style.width = '0%';
                    progressLabel.textContent = '';
                    showNotification(`📄 "${file.name}" ready for OCR`, 'success');
                } catch (e) {
                    showNotification('⚠️ Could not read PDF', 'error');
                }
            }

            // Perform OCR on a single page
            async function ocrPage(pageNum, lang) {
                const page = await pdfDoc.getPage(pageNum);
                const viewport = page.getViewport({ scale: 2.0 }); // higher scale for better OCR
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                await page.render({ canvasContext: context, viewport }).promise;

                // Perform OCR
                const { data: { text } } = await Tesseract.recognize(canvas, lang, {
                    logger: info => {
                        // Optional: per-page progress
                    }
                });
                return text.trim();
            }

            // Start OCR process
            btnStartOCR.addEventListener('click', async () => {
                if (!pdfDoc || isProcessing) return;
                isProcessing = true;
                btnStartOCR.disabled = true;
                btnStartOCR.querySelector('.btn-text').innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Processing...';
                resultText.value = '';
                progressContainer.classList.add('show');
                const lang = langSelect.value;
                let fullText = '';

                try {
                    for (let i = 1; i <= totalPages; i++) {
                        progressLabel.textContent = `Processing page ${i} of ${totalPages}...`;
                        const pageText = await ocrPage(i, lang);
                        fullText += pageText + '\n\n';
                        // Update progress
                        const percent = Math.round((i / totalPages) * 100);
                        progressBar.style.width = percent + '%';
                    }
                    resultText.value = fullText.trim();
                    progressLabel.textContent = 'OCR completed!';
                    btnDownloadText.disabled = false;
                    btnCopyText.disabled = false;
                    showNotification('✅ Text extracted successfully!', 'success');
                } catch (e) {
                    console.error(e);
                    showNotification('⚠️ OCR failed. Try a different language or check the PDF.', 'error');
                } finally {
                    isProcessing = false;
                    btnStartOCR.disabled = false;
                    btnStartOCR.querySelector('.btn-text').innerHTML = '<i class="fas fa-play"></i> Start OCR Extraction';
                }
            });

            // Download .txt
            btnDownloadText.addEventListener('click', () => {
                const text = resultText.value;
                if (!text) return;
                const blob = new Blob([text], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'extracted_text.txt';
                a.click();
                URL.revokeObjectURL(url);
                showNotification('✅ Text file downloaded', 'success');
            });

            // Copy to clipboard
            btnCopyText.addEventListener('click', () => {
                const text = resultText.value;
                navigator.clipboard.writeText(text).then(() => showNotification('📋 Text copied to clipboard', 'success'));
            });

            // File input / drag & drop
            uploadZone.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', (e) => {
                if (e.target.files[0]) {
                    loadPDF(e.target.files[0]);
                    fileInput.value = '';
                }
            });
            uploadZone.addEventListener('dragover', (e) => { e.preventDefault(); uploadZone.classList.add('dragover'); });
            uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
            uploadZone.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadZone.classList.remove('dragover');
                if (e.dataTransfer.files[0]) loadPDF(e.dataTransfer.files[0]);
            });
            btnChangeFile.addEventListener('click', resetAll);

            // Initial UI
            resetAll();
            showNotification('🔍 PDF to OCR ready. Upload a scanned document.', 'success');
        })();
    </script>
</body>
</html>
