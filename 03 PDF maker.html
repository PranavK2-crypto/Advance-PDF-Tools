<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JPG to PDF – Tool Kit</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <!-- jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>

    <style>
        /* ─────────── Reset & Base ─────────── */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --bg-start: #f0f4fe;
            --bg-end: #d9e2ef;
            --surface: rgba(255, 255, 255, 0.72);
            --surface-hover: rgba(255, 255, 255, 0.85);
            --text-primary: #0a1628;
            --text-secondary: #334155;
            --text-muted: #94a3b8;
            --border-light: rgba(255, 255, 255, 0.50);
            --shadow-sm: 0 2px 12px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 40px rgba(0, 0, 0, 0.07);
            --shadow-lg: 0 30px 60px -20px rgba(0, 0, 0, 0.30);
            --radius: 32px;
            --radius-sm: 20px;
            --transition: 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            --gradient-primary: linear-gradient(135deg, #2563eb, #7c3aed);
            --gradient-btn: linear-gradient(135deg, #4f46e5, #6366f1);
        }

        body {
            font-family: var(--font);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, var(--bg-start) 0%, var(--bg-end) 100%);
            padding: 1.5rem;
            animation: bgPulse 14s ease-in-out infinite alternate;
        }

        @keyframes bgPulse {
            0% {
                background: linear-gradient(145deg, #f0f4ff 0%, #d9e2ef 100%);
            }
            100% {
                background: linear-gradient(145deg, #e8edfa 0%, #c8d6e8 100%);
            }
        }

        /* ─────────── Card ─────────── */
        .card {
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg), 0 0 0 1px var(--border-light) inset;
            padding: 2.5rem 2rem 2rem;
            max-width: 600px;
            width: 100%;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.4s ease;
            animation: cardIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--gradient-primary);
            opacity: 0.6;
        }

        @keyframes cardIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card:hover {
            transform: translateY(-4px) scale(1.005);
            box-shadow: 0 40px 80px -24px rgba(0, 0, 0, 0.35), 0 0 0 1px rgba(255, 255, 255, 0.7) inset;
        }

        /* ─────────── Header ─────────── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.2rem;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            background: var(--gradient-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 22px;
            box-shadow: 0 4px 16px rgba(37, 99, 235, 0.25);
            flex-shrink: 0;
        }

        h1 {
            font-weight: 700;
            font-size: 1.7rem;
            color: var(--text-primary);
            letter-spacing: -0.03em;
        }

        .badge-private {
            background: #10b981;
            color: #fff;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 4px 16px;
            border-radius: 40px;
            letter-spacing: 0.3px;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.25);
            animation: pulseBadge 3s ease-in-out infinite;
        }

        @keyframes pulseBadge {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.05);
            }
        }

        .sub {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin: 0.2rem 0 1.6rem 0;
            padding-left: 16px;
            border-left: 4px solid #6366f1;
            font-weight: 400;
            line-height: 1.5;
        }

        /* ─────────── Drop Zone ─────────── */
        .drop-zone {
            border: 2px dashed #cbd5e1;
            border-radius: var(--radius-sm);
            padding: 2.6rem 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            background: rgba(255, 255, 255, 0.20);
            margin-bottom: 1.2rem;
            position: relative;
            animation: dropPulse 3s ease-in-out infinite;
        }

        @keyframes dropPulse {
            0%,
            100% {
                border-color: #cbd5e1;
            }
            50% {
                border-color: #a5b4fc;
            }
        }

        .drop-zone:hover {
            border-color: #818cf8;
            background: rgba(129, 140, 248, 0.08);
            transform: scale(1.02);
            animation: none;
        }

        .drop-zone.dragover {
            border-color: #4f46e5;
            background: rgba(79, 70, 229, 0.12);
            transform: scale(1.035);
            box-shadow: 0 0 0 6px rgba(79, 70, 229, 0.08);
            animation: none;
        }

        .drop-zone .icon-wrap {
            font-size: 3.2rem;
            line-height: 1;
            margin-bottom: 0.2rem;
            display: inline-block;
            color: #4f46e5;
            animation: floatIcon 4s ease-in-out infinite;
        }

        @keyframes floatIcon {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        .drop-zone p {
            color: #1e293b;
            font-weight: 500;
            font-size: 1.05rem;
            margin: 0;
        }

        .drop-zone p strong {
            color: #4f46e5;
            font-weight: 600;
        }

        .drop-zone small {
            color: var(--text-muted);
            font-size: 0.8rem;
            display: block;
            margin-top: 4px;
        }

        #fileInput {
            display: none;
        }

        /* ─────────── Toolbar ─────────── */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0.5rem 0 0.8rem;
        }

        #status {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #status .status-icon {
            font-size: 1rem;
        }

        #status.success {
            color: #10b981;
            font-weight: 600;
        }
        #status.error {
            color: #ef4444;
        }

        .clear-btn {
            background: transparent;
            border: none;
            color: #ef4444;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            padding: 4px 16px;
            border-radius: 40px;
            transition: all 0.2s ease;
            display: none;
            transform: scale(0.8);
            opacity: 0;
            align-items: center;
            gap: 6px;
        }

        .clear-btn.visible {
            display: inline-flex;
            animation: fadeScaleIn 0.3s ease forwards;
        }

        @keyframes fadeScaleIn {
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .clear-btn:hover {
            background: #fee2e2;
            transform: scale(1.05);
        }

        /* ─────────── Preview Grid ─────────── */
        #preview {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: flex-start;
            margin: 0.8rem 0 1.2rem;
            min-height: 60px;
            padding: 4px 0;
        }

        #preview .thumb {
            position: relative;
            border-radius: 14px;
            overflow: visible;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            border: 2px solid rgba(255, 255, 255, 0.8);
            width: 76px;
            height: 76px;
            background: #f1f5f9;
            flex-shrink: 0;
            animation: thumbIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
            transform: scale(0.8) rotate(-2deg);
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.25s ease;
        }

        @keyframes thumbIn {
            to {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        #preview .thumb:hover {
            transform: scale(1.08) rotate(1deg);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
            z-index: 2;
        }

        #preview .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            border-radius: 12px;
        }

        #preview .thumb .badge {
            position: absolute;
            bottom: 2px;
            right: 2px;
            background: rgba(15, 23, 42, 0.75);
            color: #fff;
            font-size: 0.6rem;
            font-weight: 600;
            padding: 0 8px;
            border-radius: 30px;
            backdrop-filter: blur(4px);
            line-height: 1.7;
            pointer-events: none;
            font-feature-settings: "tnum";
        }

        /* ── Individual remove button ── */
        .thumb .remove-btn {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #ef4444;
            color: #fff;
            border: 2px solid #fff;
            font-size: 13px;
            font-weight: 700;
            line-height: 1;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            box-shadow: 0 2px 12px rgba(239, 68, 68, 0.4);
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            opacity: 0;
            transform: scale(0.6);
            pointer-events: none;
            z-index: 5;
        }

        .thumb:hover .remove-btn {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .remove-btn:hover {
            background: #dc2626;
            transform: scale(1.2) !important;
            box-shadow: 0 4px 16px rgba(239, 68, 68, 0.5);
        }

        .remove-btn:active {
            transform: scale(0.85) !important;
        }

        /* ─────────── Progress ─────────── */
        .progress-wrap {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 1.5rem;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .progress-wrap.active {
            opacity: 1;
            animation: progressGlow 1.5s ease-in-out infinite alternate;
        }

        @keyframes progressGlow {
            0% {
                box-shadow: 0 0 0 0 rgba(79, 70, 229, 0);
            }
            100% {
                box-shadow: 0 0 16px 6px rgba(79, 70, 229, 0.12);
            }
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--gradient-primary);
            border-radius: 10px;
            transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* ─────────── Buttons ─────────── */
        .actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex: 1;
            padding: 14px 24px;
            font-size: 1.05rem;
            font-weight: 600;
            color: #fff;
            background: var(--gradient-btn);
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 28px -8px rgba(79, 70, 229, 0.4);
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
        }

        .btn::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #818cf8, #4f46e5);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .btn:hover:not(:disabled)::after {
            opacity: 1;
        }

        .btn:hover:not(:disabled) {
            transform: scale(1.03);
            box-shadow: 0 12px 36px -8px rgba(79, 70, 229, 0.5);
        }

        .btn:active:not(:disabled) {
            transform: scale(0.96);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
            transform: scale(1);
        }

        .btn .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .btn.loading .spinner {
            display: inline-block;
        }

        .btn.loading .btn-text {
            opacity: 0.8;
        }

        .btn .btn-text,
        .btn .spinner {
            position: relative;
            z-index: 1;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ─────────── Footer ─────────── */
        .footer {
            margin-top: 1.6rem;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .footer span {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .footer .dot {
            color: #cbd5e1;
        }

        /* ─────────── Success checkmark ─────────── */
        .checkmark {
            display: inline-block;
            animation: popCheck 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            font-size: 1.2rem;
        }

        @keyframes popCheck {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* ─────────── Responsive ─────────── */
        @media (max-width: 520px) {
            .card {
                padding: 1.5rem 1rem;
                border-radius: 24px;
            }
            h1 {
                font-size: 1.3rem;
            }
            .header-icon {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
            .badge-private {
                font-size: 0.55rem;
                padding: 3px 12px;
            }
            .drop-zone {
                padding: 1.8rem 0.5rem;
            }
            .drop-zone .icon-wrap {
                font-size: 2.6rem;
            }
            .drop-zone p {
                font-size: 0.95rem;
            }
            #preview .thumb {
                width: 64px;
                height: 64px;
            }
            .btn {
                font-size: 0.95rem;
                padding: 12px 16px;
            }
            .thumb .remove-btn {
                width: 24px;
                height: 24px;
                font-size: 11px;
                top: -6px;
                right: -6px;
            }
            .sub {
                font-size: 0.85rem;
                padding-left: 12px;
            }
            .footer {
                font-size: 0.7rem;
                gap: 8px;
            }
            .header {
                flex-wrap: wrap;
                gap: 8px;
            }
            .header-left {
                gap: 8px;
            }
        }

        @media (max-width: 380px) {
            .card {
                padding: 1.2rem 0.8rem;
            }
            #preview .thumb {
                width: 56px;
                height: 56px;
            }
            .btn {
                font-size: 0.85rem;
                padding: 10px 12px;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Header -->
        <div class="header">
            <div class="header-left">
                <span class="header-icon"><i class="fas fa-file-pdf"></i></span>
                <h1>JPG → PDF</h1>
            </div>
            <span class="badge-private"><i class="fas fa-lock"></i> 100% local</span>
        </div>
        <div class="sub">
            <i class="fas fa-cloud-upload-alt" style="color:#6366f1; margin-right:8px;"></i>
            Drop your images – we'll merge them into a single PDF, right in your browser.
        </div>

        <!-- Drop zone -->
        <div class="drop-zone" id="dropZone">
            <div class="icon-wrap"><i class="fas fa-images"></i></div>
            <p>Drop images here or <strong>click to browse</strong></p>
            <small><i class="fas fa-check-circle" style="color:#10b981;"></i> Supports JPG, PNG, BMP, WEBP</small>
            <input type="file" id="fileInput" accept="image/*" multiple />
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div id="status">
                <span class="status-icon"><i class="fas fa-sparkles"></i></span>
                No images selected
            </div>
            <button class="clear-btn" id="clearBtn">
                <i class="fas fa-trash-alt"></i> Clear all
            </button>
        </div>

        <!-- Preview -->
        <div id="preview"></div>

        <!-- Progress -->
        <div class="progress-wrap" id="progressWrap">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <!-- Actions -->
        <div class="actions">
            <button class="btn" id="convertBtn" disabled>
                <span class="spinner"></span>
                <span class="btn-text"><i class="fas fa-arrow-right"></i> Convert &amp; Download</span>
            </button>
        </div>

        <div class="footer">
            <span><i class="fas fa-shield-alt"></i> No uploads – stays on your device</span>
            <span class="dot">·</span>
            <span><i class="fas fa-bolt"></i> Free &amp; private</span>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            const fileInput = document.getElementById('fileInput');
            const dropZone = document.getElementById('dropZone');
            const preview = document.getElementById('preview');
            const status = document.getElementById('status');
            const clearBtn = document.getElementById('clearBtn');
            const convertBtn = document.getElementById('convertBtn');
            const progressWrap = document.getElementById('progressWrap');
            const progressBar = document.getElementById('progressBar');

            let selectedFiles = [];

            // ── Helpers ──
            function readFileAsDataURL(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (e) => resolve(e.target.result);
                    reader.onerror = (e) => reject(e);
                    reader.readAsDataURL(file);
                });
            }

            function loadImage(src) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.onerror = (err) => reject(err);
                    img.src = src;
                });
            }

            // ── UI State ──
            function updateUIState(files) {
                const statusIcon = status.querySelector('.status-icon');
                if (!files || files.length === 0) {
                    status.innerHTML = `<span class="status-icon"><i class="fas fa-sparkles"></i></span> No images selected`;
                    status.className = '';
                    clearBtn.classList.remove('visible');
                    convertBtn.disabled = true;
                    return;
                }
                clearBtn.classList.add('visible');
                convertBtn.disabled = false;
                status.innerHTML =
                    `<span class="status-icon"><i class="fas fa-check-circle" style="color:#10b981;"></i></span> ${files.length} image(s) ready`;
                status.className = '';
            }

            // ── Render Preview ──
            function renderPreview(files) {
                preview.innerHTML = '';
                if (!files || files.length === 0) {
                    updateUIState(files);
                    return;
                }

                files.forEach((file, idx) => {
                    const thumb = document.createElement('div');
                    thumb.className = 'thumb';
                    thumb.style.animationDelay = (idx * 0.06) + 's';

                    const img = document.createElement('img');
                    const url = URL.createObjectURL(file);
                    img.src = url;
                    img.onload = () => URL.revokeObjectURL(url);
                    img.alt = `Image ${idx + 1}`;

                    const badge = document.createElement('span');
                    badge.className = 'badge';
                    badge.textContent = idx + 1;

                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'remove-btn';
                    removeBtn.innerHTML = '<i class="fas fa-times"></i>';
                    removeBtn.setAttribute('data-index', idx);
                    removeBtn.setAttribute('title', 'Remove this image');

                    thumb.appendChild(img);
                    thumb.appendChild(badge);
                    thumb.appendChild(removeBtn);
                    preview.appendChild(thumb);
                });

                updateUIState(files);
            }

            // ── File handler ──
            function updateFiles(files) {
                if (!files || files.length === 0) {
                    selectedFiles = [];
                    renderPreview([]);
                    return;
                }
                const valid = Array.from(files).filter(f => f.type.startsWith('image/'));
                if (valid.length === 0) {
                    status.innerHTML =
                        `<span class="status-icon"><i class="fas fa-exclamation-triangle" style="color:#ef4444;"></i></span> Please select only image files.`;
                    status.className = 'error';
                    return;
                }
                selectedFiles = valid;
                renderPreview(selectedFiles);
            }

            function clearAll() {
                selectedFiles = [];
                renderPreview([]);
                fileInput.value = '';
                progressWrap.classList.remove('active');
                progressBar.style.width = '0%';
                convertBtn.classList.remove('loading');
                convertBtn.disabled = true;
                status.innerHTML = `<span class="status-icon"><i class="fas fa-sparkles"></i></span> No images selected`;
                status.className = '';
            }

            // ── Remove individual image (event delegation) ──
            preview.addEventListener('click', (e) => {
                const btn = e.target.closest('.remove-btn');
                if (!btn) return;
                const index = parseInt(btn.getAttribute('data-index'), 10);
                if (isNaN(index)) return;

                selectedFiles.splice(index, 1);
                renderPreview(selectedFiles);
                fileInput.value = '';

                if (selectedFiles.length === 0) {
                    progressWrap.classList.remove('active');
                    progressBar.style.width = '0%';
                    convertBtn.classList.remove('loading');
                    convertBtn.disabled = true;
                }
            });

            // ── Events ──
            fileInput.addEventListener('change', (e) => {
                updateFiles(e.target.files);
                fileInput.value = '';
            });

            dropZone.addEventListener('click', () => fileInput.click());

            dropZone.addEventListener('dragover', (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            });
            dropZone.addEventListener('dragleave', () => {
                dropZone.classList.remove('dragover');
            });
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
                updateFiles(e.dataTransfer.files);
            });

            clearBtn.addEventListener('click', clearAll);

            // ── Convert ──
            convertBtn.addEventListener('click', async function() {
                if (!selectedFiles || selectedFiles.length === 0) return;

                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF('p', 'mm', 'a4');
                const pageWidth = pdf.internal.pageSize.getWidth();
                const pageHeight = pdf.internal.pageSize.getHeight();

                convertBtn.classList.add('loading');
                convertBtn.disabled = true;
                progressWrap.classList.add('active');
                progressBar.style.width = '0%';
                status.innerHTML =
                    `<span class="status-icon"><i class="fas fa-spinner fa-pulse"></i></span> Processing images...`;
                status.className = '';

                try {
                    for (let i = 0; i < selectedFiles.length; i++) {
                        const dataUrl = await readFileAsDataURL(selectedFiles[i]);
                        const img = await loadImage(dataUrl);

                        let w = img.width,
                            h = img.height;
                        const ratio = Math.min(pageWidth / w, pageHeight / h);
                        const finalW = w * ratio;
                        const finalH = h * ratio;
                        const x = (pageWidth - finalW) / 2;
                        const y = (pageHeight - finalH) / 2;

                        if (i > 0) pdf.addPage();
                        pdf.addImage(dataUrl, 'JPEG', x, y, finalW, finalH, undefined, 'FAST');

                        const pct = Math.round(((i + 1) / selectedFiles.length) * 100);
                        progressBar.style.width = pct + '%';
                        status.innerHTML =
                            `<span class="status-icon"><i class="fas fa-spinner fa-pulse"></i></span> Processing ${i + 1} of ${selectedFiles.length}`;
                    }

                    pdf.save('converted.pdf');
                    status.innerHTML =
                        `<span class="status-icon"><span class="checkmark">✅</span></span> PDF downloaded successfully!`;
                    status.className = 'success';
                    progressBar.style.width = '100%';

                } catch (error) {
                    console.error(error);
                    status.innerHTML =
                        `<span class="status-icon"><i class="fas fa-exclamation-circle" style="color:#ef4444;"></i></span> Error: Failed to process images. Please try again.`;
                    status.className = 'error';
                    progressBar.style.width = '0%';
                } finally {
                    convertBtn.classList.remove('loading');
                    convertBtn.disabled = false;
                    setTimeout(() => {
                        progressWrap.classList.remove('active');
                    }, 1600);
                }
            });

            // ── Init ──
            renderPreview([]);

        })();
    </script>

</body>
</html>
