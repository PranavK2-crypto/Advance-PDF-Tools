<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Organizer · Tool Kit</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        :root {
            --bg: #f6f8fc;
            --panel-bg: #ffffff;
            --primary: #3b82f6;
            --text: #1e293b;
            --text-dark: #0f172a;
            --muted: #64748b;
            --border: #e9edf4;
            --radius-lg: 20px;
            --radius-md: 16px;
            --radius-sm: 12px;
            --radius-xs: 8px;
            --shadow: 0 4px 20px rgba(0,0,0,0.04);
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        *{box-sizing:border-box;margin:0;padding:0;}
        body{font-family:var(--font);background:var(--bg);color:var(--text);padding:24px 20px 40px;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;}
        .app-wrapper{max-width:1150px;width:100%;}
        .app-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:28px;padding-bottom:16px;border-bottom:2px solid var(--border);}
        .app-header h1{font-size:26px;font-weight:700;background:linear-gradient(135deg,#0f172a,#3b82f6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-0.3px;display:flex;align-items:center;gap:10px;}
        .app-header h1 .tool-icon{font-size:28px;color:#3b82f6;-webkit-text-fill-color:initial;}
        .app-header h1 span{font-weight:400;font-size:14px;background:#e9edf4;color:#1e293b;-webkit-text-fill-color:#1e293b;padding:2px 14px;border-radius:30px;}
        .header-badge{background:#dbeafe;color:#1e4f8a;padding:6px 18px;border-radius:40px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px;}
        .main-grid{display:grid;grid-template-columns:1fr 1.4fr;gap:28px;margin-top:6px;}
        @media(max-width:900px){.main-grid{grid-template-columns:1fr;}}
        .panel{background:var(--panel-bg);border-radius:var(--radius-lg);padding:24px 26px 28px;box-shadow:var(--shadow);border:1px solid var(--border);}
        .panel-title{font-size:15px;font-weight:600;color:var(--text-dark);margin-bottom:18px;display:flex;align-items:center;gap:10px;}
        .panel-title i{font-size:18px;color:var(--primary);}
        .panel-title .badge-count{background:#eef2f9;font-size:13px;font-weight:600;padding:0 12px;border-radius:30px;color:#1e293b;line-height:24px;margin-left:auto;}
        .upload-zone{border:2px dashed #d0d9e8;border-radius:var(--radius-md);padding:28px 20px;text-align:center;cursor:pointer;background:#fafcff;position:relative;margin-bottom:10px;}
        .upload-zone:hover{border-color:#6b8fcb;background:#f2f7ff;}
        .upload-zone.dragover{border-color:#3b82f6;background:#eef6ff;}
        .upload-zone .icon{font-size:38px;margin-bottom:8px;color:#3b82f6;}
        .upload-zone input[type='file']{position:absolute;inset:0;opacity:0;cursor:pointer;}
        .file-list{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;max-height:130px;overflow-y:auto;}
        .file-tag{
            background:#eef2f9;
            padding:5px 14px;
            border-radius:30px;
            font-size:13px;
            display:flex;
            align-items:center;
            gap:8px;
            max-width:220px;
            overflow:hidden;
        }
        .file-tag .file-name{
            overflow:hidden;
            text-overflow:ellipsis;
            white-space:nowrap;
            flex:1;
            min-width:0;
        }
        .file-tag .file-pages{
            flex-shrink:0;
            font-size:11px;
            color:#64748b;
            background:#dce2ec;
            padding:1px 8px;
            border-radius:20px;
            font-weight:500;
        }
        .file-tag .remove{
            flex-shrink:0;
            cursor:pointer;
            color:#94a3b8;
            font-weight:600;
            font-size:16px;
            line-height:1;
            padding:0 2px;
        }
        .btn{padding:10px 18px;border-radius:30px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all 0.2s;display:inline-flex;align-items:center;gap:7px;}
        .btn-sm{padding:7px 14px;font-size:12px;border-radius:24px;}
        .btn-outline{background:#fff;border:1.5px solid #dce2ec;color:#1e293b;}
        .btn-outline:hover{border-color:#3b82f6;color:#2563eb;}
        .btn-primary-action{width:100%;padding:16px 20px;background:linear-gradient(135deg,#0f172a,#2563eb);color:#fff;border-radius:var(--radius-md);font-size:17px;font-weight:600;box-shadow:0 4px 14px rgba(37,99,235,0.30);}
        .btn-primary-action:disabled{opacity:0.5;cursor:not-allowed;}
        .action-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;}
        .action-row .btn{flex:1;min-width:100px;justify-content:center;}
        .toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center;}
        .toolbar .btn{font-size:12px;padding:6px 14px;}
        .separator{width:1px;height:24px;background:#dce2ec;margin:0 6px;}
        .info-text{font-size:12px;color:#64748b;margin-left:auto;font-weight:500;}
        .preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;max-height:420px;overflow-y:auto;padding:4px;border-radius:var(--radius-sm);background:#fafcff;border:1.5px solid #edf1f9;min-height:120px;align-content:start;}
        .preview-item{border-radius:var(--radius-xs);overflow:hidden;border:2px solid #e9edf4;background:#fff;aspect-ratio:0.75;display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;transition:border-color 0.2s;}
        .preview-item:hover{border-color:#3b82f6;}
        .preview-item.selected{border-color:#3b82f6;box-shadow:0 0 0 4px rgba(59,130,246,0.2);}
        .preview-item img{width:100%;height:100%;object-fit:contain;background:#fff;}
        .preview-item .page-num{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,0.78);color:#fff;font-size:10px;padding:2px 10px;border-radius:20px;}
        .preview-item .view-icon{position:absolute;top:5px;left:5px;background:rgba(255,255,255,0.9);color:#3b82f6;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:14px;opacity:0;transition:opacity 0.2s;}
        .preview-item:hover .view-icon{opacity:1;}
        .preview-item .loading-spinner{font-size:24px;color:#cbd5e1;animation:spin 1s linear infinite;}
        @keyframes spin{to{transform:rotate(360deg);}}
        .checkbox-row{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:14px;}
        .checkbox-row input{accent-color:#3b82f6;width:18px;height:18px;}
        .progress-wrap{margin-top:14px;display:none;}
        .progress-wrap.visible{display:block;}
        .progress-bar-bg{width:100%;height:8px;background:#e9edf4;border-radius:10px;}
        .progress-bar-fill{height:100%;width:0%;background:linear-gradient(90deg,#3b82f6,#60a5fa);border-radius:10px;transition:width 0.3s;}
        .toast-container{position:fixed;top:20px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none;}
        .toast{background:#0f172a;color:#fff;padding:12px 20px;border-radius:30px;animation:slideIn 0.35s ease;}
        /* MODAL */
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:10000;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px);}
        .modal-content{background:#fff;border-radius:20px;max-width:90vw;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;position:relative;}
        .modal-header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid #e9edf4;}
        .modal-header h3{margin:0;font-size:16px;}
        .modal-close{background:none;border:none;font-size:24px;cursor:pointer;color:#64748b;}
        .modal-body{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;background:#f1f5f9;padding:20px;}
        .modal-body img{max-width:100%;max-height:70vh;object-fit:contain;box-shadow:0 8px 24px rgba(0,0,0,0.15);border-radius:8px;}
        .modal-nav{display:flex;justify-content:center;gap:20px;padding:12px;border-top:1px solid #e9edf4;}
        .modal-nav button{background:#fff;border:1px solid #dce2ec;border-radius:30px;padding:8px 18px;cursor:pointer;font-weight:600;}
        .modal-nav button:hover{background:#f8faff;border-color:#3b82f6;}
        @keyframes slideIn{from{transform:translateX(120%);opacity:0;}to{transform:translateX(0);opacity:1;}}
        .text-muted{color:#64748b;font-size:13px;}
    </style>
</head>
<body>
    <div class="app-wrapper">
        <header class="app-header">
            <h1><i class="fa-solid fa-object-group tool-icon"></i> PDF Organizer <span>+ live preview</span></h1>
            <div class="header-badge"><i class="fa-solid fa-magnifying-glass"></i> Double-click to enlarge</div>
        </header>
        <div class="main-grid">
            <!-- LEFT PANEL -->
            <div class="panel">
                <div class="panel-title"><i class="fa-solid fa-cloud-upload-alt"></i> Upload PDFs <span class="badge-count" id="fileCount">0 files</span></div>
                <div class="upload-zone" id="uploadZone">
                    <i class="fa-solid fa-file-pdf icon"></i>
                    <div class="label">Drop PDF files here</div>
                    <div class="hint">or click to browse · Multiple files</div>
                    <input type="file" id="fileInput" accept=".pdf" multiple />
                </div>
                <div class="file-list" id="fileList"></div>
                <div class="upload-status"><span class="count" id="totalPagesBadge">0 pages total</span></div>
                <button class="btn btn-outline btn-sm" id="clearAllBtn" style="width:100%;margin-top:10px;"><i class="fa-solid fa-trash-can"></i> Clear All Files</button>
                <div class="action-row" style="margin-top:14px;">
                    <button class="btn btn-outline btn-sm" id="selectAllBtn"><i class="fa-solid fa-check-double"></i> Select All</button>
                    <button class="btn btn-outline btn-sm" id="deselectAllBtn"><i class="fa-solid fa-circle"></i> Deselect</button>
                    <button class="btn btn-outline btn-sm" id="invertSelectionBtn"><i class="fa-solid fa-rotate"></i> Invert</button>
                </div>
                <button class="btn btn-outline btn-sm danger" id="removeSelectedBtn" style="width:100%;margin-top:6px;"><i class="fa-solid fa-xmark"></i> Remove Selected Pages</button>
            </div>
            <!-- RIGHT PANEL -->
            <div class="panel">
                <div class="panel-title"><i class="fa-solid fa-th"></i> Page Organizer <span class="badge-count" id="pageCountBadge">0 pages</span></div>
                <div class="toolbar">
                    <button class="btn btn-outline btn-sm" id="moveTopBtn"><i class="fa-solid fa-angles-up"></i> Top</button>
                    <button class="btn btn-outline btn-sm" id="moveUpBtn"><i class="fa-solid fa-angle-up"></i> Up</button>
                    <button class="btn btn-outline btn-sm" id="moveDownBtn"><i class="fa-solid fa-angle-down"></i> Down</button>
                    <button class="btn btn-outline btn-sm" id="moveBottomBtn"><i class="fa-solid fa-angles-down"></i> Bottom</button>
                    <span class="separator"></span>
                    <button class="btn btn-outline btn-sm" id="resetOrderBtn"><i class="fa-solid fa-arrow-rotate-left"></i> Reset Order</button>
                    <span class="info-text" id="selectionInfo">0 selected</span>
                </div>
                <div class="preview-grid" id="previewGrid">
                    <div class="preview-empty" id="previewEmpty"><i class="fa-solid fa-file-import big-icon"></i> Upload PDFs to see pages</div>
                </div>
                <div class="checkbox-row">
                    <input type="checkbox" id="addPageNumbersCheckbox" />
                    <label for="addPageNumbersCheckbox">Add page numbers after reorder</label>
                    <span class="inline-hint">(stamps "Page X of Y" at bottom)</span>
                </div>
                <div class="progress-wrap" id="progressWrap">
                    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill"></div></div>
                    <div class="progress-text"><span id="progressMsg">Processing...</span><span id="progressPercent">0%</span></div>
                </div>
                <div class="action-row" style="margin-top:10px;">
                    <button class="btn-primary-action" id="mergeBtn" disabled><i class="fa-solid fa-object-group"></i> Download Organizer PDF</button>
                </div>
            </div>
        </div>
    </div>
    <div class="toast-container" id="toastContainer"></div>
    <!-- MODAL -->
    <div id="pagePreviewModal" style="display:none;">
        <div class="modal-overlay" id="modalOverlay">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="modalTitle">Page 1 of 5</h3>
                    <button class="modal-close" id="modalClose">&times;</button>
                </div>
                <div class="modal-body" id="modalBody">
                    <img id="modalImage" src="" alt="Large preview" style="display:none;" />
                    <div id="modalLoading" style="color:#64748b;"><i class="fa-solid fa-spinner fa-spin"></i> Loading high-res preview...</div>
                </div>
                <div class="modal-nav">
                    <button id="modalPrev"><i class="fa-solid fa-chevron-left"></i> Previous</button>
                    <button id="modalNext">Next <i class="fa-solid fa-chevron-right"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            if (typeof pdfjsLib !== 'undefined') {
                pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
            }

            // DOM
            const uploadZone = document.getElementById('uploadZone');
            const fileInput = document.getElementById('fileInput');
            const fileListEl = document.getElementById('fileList');
            const totalPagesBadge = document.getElementById('totalPagesBadge');
            const fileCountEl = document.getElementById('fileCount');
            const previewGrid = document.getElementById('previewGrid');
            const previewEmpty = document.getElementById('previewEmpty');
            const pageCountBadge = document.getElementById('pageCountBadge');
            const selectionInfo = document.getElementById('selectionInfo');
            const progressWrap = document.getElementById('progressWrap');
            const progressFill = document.getElementById('progressFill');
            const progressMsg = document.getElementById('progressMsg');
            const progressPercent = document.getElementById('progressPercent');
            const mergeBtn = document.getElementById('mergeBtn');
            const clearAllBtn = document.getElementById('clearAllBtn');
            const selectAllBtn = document.getElementById('selectAllBtn');
            const deselectAllBtn = document.getElementById('deselectAllBtn');
            const invertSelectionBtn = document.getElementById('invertSelectionBtn');
            const removeSelectedBtn = document.getElementById('removeSelectedBtn');
            const moveTopBtn = document.getElementById('moveTopBtn');
            const moveUpBtn = document.getElementById('moveUpBtn');
            const moveDownBtn = document.getElementById('moveDownBtn');
            const moveBottomBtn = document.getElementById('moveBottomBtn');
            const resetOrderBtn = document.getElementById('resetOrderBtn');
            const addPageNumbersCheckbox = document.getElementById('addPageNumbersCheckbox');
            const toastContainer = document.getElementById('toastContainer');
            // Modal
            const modalOverlay = document.getElementById('modalOverlay');
            const modalTitle = document.getElementById('modalTitle');
            const modalImage = document.getElementById('modalImage');
            const modalLoading = document.getElementById('modalLoading');
            const modalPrev = document.getElementById('modalPrev');
            const modalNext = document.getElementById('modalNext');
            const modalClose = document.getElementById('modalClose');
            const pagePreviewModal = document.getElementById('pagePreviewModal');
            let currentPreviewIndex = -1;

            const SOURCE_COLORS = ['#3b82f6','#ef4444','#10b981','#f59e0b','#8b5cf6','#ec4899','#06b6d4','#f97316','#6366f1','#14b8a6'];
            let uploadedFiles = [];
            let allPages = [];   // {id, sourceFileId, sourcePageNum, selected, thumbnailUrl, thumbnailLoading, element}
            let pageIdCounter = 0, fileIdCounter = 0;

            // ── Toast & Progress ──
            function showToast(msg, type='') {
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.innerHTML = msg;
                toastContainer.appendChild(toast);
                setTimeout(() => toast.remove(), 2700);
            }
            function showProgress(msg, pct){
                progressWrap.classList.add('visible');
                progressMsg.textContent=msg;
                progressPercent.textContent=Math.round(pct)+'%';
                progressFill.style.width=pct+'%';
            }
            function hideProgress(){ progressWrap.classList.remove('visible'); }

            // ── Counters & empty state ──
            function updateCounters() {
                const total = allPages.length, files = uploadedFiles.length, sel = allPages.filter(p=>p.selected).length;
                fileCountEl.textContent = files+' file'+(files!==1?'s':'');
                totalPagesBadge.textContent = total+' page'+(total!==1?'s':'')+' total';
                pageCountBadge.textContent = total+' page'+(total!==1?'s':'');
                selectionInfo.textContent = sel+' selected';
                mergeBtn.disabled = !total;
                removeSelectedBtn.disabled = !sel;
                [moveTopBtn,moveUpBtn,moveDownBtn,moveBottomBtn].forEach(b=>b.disabled=!sel);
                [selectAllBtn,deselectAllBtn,invertSelectionBtn,resetOrderBtn,clearAllBtn].forEach(b=>b.disabled=!total);
                // manage empty placeholder
                if (total === 0) {
                    if (!previewGrid.contains(previewEmpty)) previewGrid.appendChild(previewEmpty);
                    previewEmpty.style.display = '';
                } else {
                    if (previewEmpty.parentNode) previewEmpty.remove();
                }
            }

            // ── File List ──
            function renderFileList() {
                fileListEl.innerHTML = uploadedFiles.map(f=>`
                    <div class="file-tag" style="border-left:3px solid ${f.color};padding-left:10px;">
                        <i class="fa-solid fa-file-pdf" style="color:${f.color};"></i>
                        <span class="file-name">${escapeHtml(f.name)}</span>
                        <span class="file-pages">${f.pageCount} pg</span>
                        <span class="remove" data-file-id="${f.id}">&times;</span>
                    </div>`).join('');
                fileListEl.querySelectorAll('.remove').forEach(btn => {
                    btn.addEventListener('click', e => {
                        e.stopPropagation();
                        removeFile(parseInt(btn.dataset.fileId));
                    });
                });
            }
            function escapeHtml(s) { const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

            // ── Grid DOM Helpers ──
            function createPageElement(page, index) {
                const file = uploadedFiles.find(f=>f.id===page.sourceFileId);
                const color = file?.color||'#94a3b8';
                const el = document.createElement('div');
                el.className = `preview-item ${page.selected?'selected':''}`;
                el.draggable = true;
                el.dataset.pageIndex = index;
                el.dataset.pageId = page.id;

                let inner = '';
                if (page.thumbnailUrl) {
                    inner = `<img src="${page.thumbnailUrl}" alt="Page ${index+1}">`;
                } else if (page.thumbnailLoading) {
                    inner = `<div class="loading-spinner"><i class="fa-solid fa-spinner fa-spin"></i></div>`;
                } else {
                    inner = `<i class="fa-solid fa-file-pdf" style="font-size:28px;color:#cbd5e1;"></i>`;
                }
                el.innerHTML = `
                    ${inner}
                    <span class="page-num">#${index+1}</span>
                    <span class="source-dot" style="background:${color};"></span>
                    <span class="view-icon"><i class="fa-solid fa-magnifying-glass-plus"></i></span>
                `;
                page.element = el;
                return el;
            }

            function updatePageElement(page, index) {
                const el = page.element;
                if (!el) return;
                el.dataset.pageIndex = index;
                el.querySelector('.page-num').textContent = `#${index+1}`;
                el.classList.toggle('selected', page.selected);

                // Replace thumbnail content if state changed
                const currentImg = el.querySelector('img');
                const currentSpinner = el.querySelector('.loading-spinner');
                const currentIcon = el.querySelector('.fa-file-pdf');

                if (page.thumbnailUrl) {
                    if (!currentImg || currentImg.src !== page.thumbnailUrl) {
                        [currentImg, currentSpinner, currentIcon].forEach(c => c?.remove());
                        const img = document.createElement('img');
                        img.src = page.thumbnailUrl;
                        img.alt = `Page ${index+1}`;
                        el.insertBefore(img, el.firstChild);
                    }
                } else if (page.thumbnailLoading) {
                    if (!currentSpinner) {
                        [currentImg, currentSpinner, currentIcon].forEach(c => c?.remove());
                        const spinner = document.createElement('div');
                        spinner.className = 'loading-spinner';
                        spinner.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
                        el.insertBefore(spinner, el.firstChild);
                    }
                } else {
                    if (!currentIcon) {
                        [currentImg, currentSpinner, currentIcon].forEach(c => c?.remove());
                        const icon = document.createElement('i');
                        icon.className = 'fa-solid fa-file-pdf';
                        icon.style.cssText = 'font-size:28px;color:#cbd5e1;';
                        el.insertBefore(icon, el.firstChild);
                    }
                }
            }

            function syncGrid() {
                // remove elements for pages that no longer exist
                const currentIds = new Set(allPages.map(p=>p.id));
                for (const child of [...previewGrid.children]) {
                    if (child === previewEmpty) continue;
                    const pid = parseInt(child.dataset.pageId);
                    if (!currentIds.has(pid)) child.remove();
                }
                // ensure elements are in correct order
                allPages.forEach((page, index) => {
                    if (!page.element) {
                        const el = createPageElement(page, index);
                        previewGrid.appendChild(el);
                    } else {
                        updatePageElement(page, index);
                        if (page.element !== previewGrid.children[index]) {
                            previewGrid.insertBefore(page.element, previewGrid.children[index] || null);
                        }
                    }
                });
            }

            // ── File & Page CRUD ──
            function removeFile(fileId) {
                const file = uploadedFiles.find(f=>f.id===fileId);
                if (!file) return;
                allPages.filter(p=>p.sourceFileId===fileId).forEach(p => {
                    if (p.thumbnailUrl?.startsWith('blob:')) URL.revokeObjectURL(p.thumbnailUrl);
                    if (p.element) p.element.remove();
                });
                allPages = allPages.filter(p=>p.sourceFileId!==fileId);
                uploadedFiles = uploadedFiles.filter(f=>f.id!==fileId);
                uploadedFiles.forEach((f,i)=>f.color=SOURCE_COLORS[i%SOURCE_COLORS.length]);
                syncGrid();
                updateCounters();
                renderFileList();
                showToast(`Removed "${file.name}"`);
            }

            function clearAllFiles() {
                allPages.forEach(p => {
                    if (p.thumbnailUrl?.startsWith('blob:')) URL.revokeObjectURL(p.thumbnailUrl);
                    if (p.element) p.element.remove();
                });
                allPages = [];
                uploadedFiles = [];
                updateCounters();
                renderFileList();
                syncGrid();
                showToast('All files cleared');
            }

            // ── PDF Loading & Thumbnails ──
            async function loadPDFFile(file) {
                const arr = await file.arrayBuffer();
                const pdfLibDoc = await PDFLib.PDFDocument.load(arr, {ignoreEncryption:true});
                const pageCount = pdfLibDoc.getPageCount();
                let pdfJsDoc = null;
                try { pdfJsDoc = await pdfjsLib.getDocument({data:arr.slice(0)}).promise; } catch(e){ console.warn('pdf.js failed', e); }
                const fileEntry = {
                    id: ++fileIdCounter, name: file.name, file, pdfLibDoc, pdfJsDoc, pageCount,
                    color: SOURCE_COLORS[uploadedFiles.length % SOURCE_COLORS.length],
                    arrayBuffer: arr
                };
                uploadedFiles.push(fileEntry);
                for (let i=0;i<pageCount;i++) {
                    allPages.push({
                        id: ++pageIdCounter,
                        sourceFileId: fileEntry.id,
                        sourcePageNum: i,
                        selected: true,
                        thumbnailUrl: null,
                        thumbnailLoading: false,
                        element: null
                    });
                }
                updateCounters();
                renderFileList();
                syncGrid();
                renderThumbnailsForFile(fileEntry);
            }

            async function renderThumbnailsForFile(fileEntry) {
                if (!fileEntry.pdfJsDoc) {
                    const pages = allPages.filter(p=>p.sourceFileId===fileEntry.id);
                    pages.forEach(p=>{ p.thumbnailLoading=false; });
                    syncGrid();
                    return;
                }
                const pages = allPages.filter(p=>p.sourceFileId===fileEntry.id);
                const scale = 0.45;
                for (const page of pages) {
                    if (!allPages.includes(page)) continue;
                    if (page.thumbnailUrl || page.thumbnailLoading) continue;
                    page.thumbnailLoading = true;
                    updatePageElement(page, allPages.indexOf(page));
                    try {
                        const pdfPage = await fileEntry.pdfJsDoc.getPage(page.sourcePageNum + 1);
                        const viewport = pdfPage.getViewport({ scale });
                        const canvas = document.createElement('canvas');
                        canvas.width = viewport.width;
                        canvas.height = viewport.height;
                        await pdfPage.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
                        page.thumbnailUrl = URL.createObjectURL(blob);
                    } catch(e) {
                        console.warn('Thumbnail failed', page.sourcePageNum+1, e);
                    } finally {
                        page.thumbnailLoading = false;
                        if (allPages.includes(page)) {
                            updatePageElement(page, allPages.indexOf(page));
                        }
                    }
                    await new Promise(r=>setTimeout(r, 5));
                }
            }

            // ── Drag & Drop (delegated) ──
            let dragSourceIndex = null;
            previewGrid.addEventListener('dragstart', e => {
                const item = e.target.closest('.preview-item');
                if (!item) return;
                dragSourceIndex = parseInt(item.dataset.pageIndex);
                item.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', '');
            });
            previewGrid.addEventListener('dragend', e => {
                const item = e.target.closest('.preview-item');
                if (item) item.classList.remove('dragging');
                previewGrid.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
                previewGrid.classList.remove('drag-over-active');
                dragSourceIndex = null;
            });
            previewGrid.addEventListener('dragover', e => {
                e.preventDefault();
                previewGrid.classList.add('drag-over-active');
                previewGrid.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
                const target = e.target.closest('.preview-item');
                if (target) target.classList.add('drag-over');
            });
            previewGrid.addEventListener('dragleave', () => {
                previewGrid.classList.remove('drag-over-active');
                previewGrid.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
            });
            previewGrid.addEventListener('drop', e => {
                e.preventDefault();
                previewGrid.classList.remove('drag-over-active');
                previewGrid.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
                const target = e.target.closest('.preview-item');
                if (!target || dragSourceIndex === null) return;
                const targetIdx = parseInt(target.dataset.pageIndex);
                if (dragSourceIndex !== targetIdx) movePage(dragSourceIndex, targetIdx);
                dragSourceIndex = null;
            });

            // ── Click & Double-click (with timeout to prevent toggle on dblclick) ──
            let clickTimer = null;
            previewGrid.addEventListener('click', e => {
                const item = e.target.closest('.preview-item');
                if (!item) return;
                const viewIcon = e.target.closest('.view-icon');
                if (viewIcon) {
                    const idx = parseInt(item.dataset.pageIndex);
                    openModal(idx);
                    return;
                }
                if (clickTimer) {
                    clearTimeout(clickTimer);
                    clickTimer = null;
                    return;
                }
                clickTimer = setTimeout(() => {
                    clickTimer = null;
                    const idx = parseInt(item.dataset.pageIndex);
                    if (allPages[idx]) {
                        allPages[idx].selected = !allPages[idx].selected;
                        updatePageElement(allPages[idx], idx);
                        updateCounters();
                    }
                }, 250);
            });
            previewGrid.addEventListener('dblclick', e => {
                const item = e.target.closest('.preview-item');
                if (!item) return;
                const idx = parseInt(item.dataset.pageIndex);
                openModal(idx);
            });

            function movePage(fromIdx, toIdx) {
                if (fromIdx === toIdx) return;
                const [moved] = allPages.splice(fromIdx, 1);
                allPages.splice(toIdx, 0, moved);
                syncGrid();
                updateCounters();
            }

            // ── Selection Actions ──
            function selectAll(){ allPages.forEach(p=>p.selected=true); syncGrid(); updateCounters(); }
            function deselectAll(){ allPages.forEach(p=>p.selected=false); syncGrid(); updateCounters(); }
            function invertSelection(){ allPages.forEach(p=>p.selected=!p.selected); syncGrid(); updateCounters(); }
            function removeSelectedPages(){
                const toRemove = allPages.filter(p=>p.selected);
                toRemove.forEach(p=>{
                    if (p.thumbnailUrl?.startsWith('blob:')) URL.revokeObjectURL(p.thumbnailUrl);
                    if (p.element) p.element.remove();
                });
                allPages = allPages.filter(p=>!p.selected);
                const ids = new Set(allPages.map(p=>p.sourceFileId));
                uploadedFiles = uploadedFiles.filter(f=>ids.has(f.id));
                uploadedFiles.forEach((f,i)=>f.color=SOURCE_COLORS[i%SOURCE_COLORS.length]);
                syncGrid();
                updateCounters();
                renderFileList();
                showToast(`Removed ${toRemove.length} page(s)`);
            }
            function moveSelected(dir){
                const idxs = allPages.reduce((arr,p,i)=>{ if(p.selected) arr.push(i); return arr; }, []);
                if (!idxs.length) return;
                if (dir==='top'){
                    const sel = idxs.map(i=>allPages[i]);
                    idxs.sort((a,b)=>b-a).forEach(i=>allPages.splice(i,1));
                    allPages.unshift(...sel);
                } else if (dir==='bottom'){
                    const sel = idxs.map(i=>allPages[i]);
                    idxs.sort((a,b)=>b-a).forEach(i=>allPages.splice(i,1));
                    allPages.push(...sel);
                } else if (dir==='up'){
                    idxs.sort((a,b)=>a-b).forEach(i=>{ if(i>0 && !allPages[i-1].selected) [allPages[i-1],allPages[i]]=[allPages[i],allPages[i-1]]; });
                } else if (dir==='down'){
                    idxs.sort((a,b)=>b-a).forEach(i=>{ if(i<allPages.length-1 && !allPages[i+1].selected) [allPages[i],allPages[i+1]]=[allPages[i+1],allPages[i]]; });
                }
                syncGrid();
                updateCounters();
            }
            function resetOrder(){
                const map = new Map(); uploadedFiles.forEach((f,i)=>map.set(f.id,i));
                allPages.sort((a,b)=>(map.get(a.sourceFileId)??999)-(map.get(b.sourceFileId)??999) || a.sourcePageNum-b.sourcePageNum);
                syncGrid();
                updateCounters();
                showToast('Order reset', 'success');
            }

            // ── Merge & Download ──
            async function mergeAndDownload(){
                if (!allPages.length) return;
                const addNumbers = addPageNumbersCheckbox.checked;
                try{
                    showProgress('Merging...',10);
                    const newDoc = await PDFLib.PDFDocument.create();
                    const total = allPages.length;
                    const copiedPages = new Array(total);
                    const groups = new Map();
                    allPages.forEach((p,i)=>{
                        if(!groups.has(p.sourceFileId)) groups.set(p.sourceFileId, []);
                        groups.get(p.sourceFileId).push({page:p, idx:i});
                    });
                    let done=0;
                    for(const [fid, arr] of groups){
                        const file = uploadedFiles.find(f=>f.id===fid);
                        if(!file) continue;
                        const srcNums = [...new Set(arr.map(a=>a.page.sourcePageNum))].sort((a,b)=>a-b);
                        const copies = new Map();
                        for(const n of srcNums){
                            const [cp] = await newDoc.copyPages(file.pdfLibDoc,[n]);
                            copies.set(n,cp);
                        }
                        for(const a of arr){
                            copiedPages[a.idx] = copies.get(a.page.sourcePageNum);
                            done++;
                            showProgress(`Merging... (${done}/${total})`, 10+(done/total)*60);
                        }
                    }
                    for(const cp of copiedPages) if(cp) newDoc.addPage(cp);
                    if(addNumbers){
                        showProgress('Adding page numbers...',75);
                        const pages = newDoc.getPages();
                        const font = await newDoc.embedFont(PDFLib.StandardFonts.Helvetica);
                        for(let i=0;i<pages.length;i++){
                            const page = pages[i];
                            const { width } = page.getSize();
                            const text = `Page ${i+1} of ${pages.length}`;
                            const textWidth = font.widthOfTextAtSize(text, 12);
                            page.drawText(text, {
                                x: (width - textWidth)/2,
                                y: 25,
                                size: 12,
                                font,
                                color: PDFLib.rgb(0.4,0.4,0.4)
                            });
                        }
                    }
                    const pdfBytes = await newDoc.save();
                    saveAs(new Blob([pdfBytes],{type:'application/pdf'}), `organized_${new Date().toISOString().slice(0,10)}.pdf`);
                    hideProgress();
                    showToast(`Merged ${total} pages`,'success');
                }catch(e){
                    hideProgress();
                    showToast('Merge failed: '+e.message,'error');
                }
            }

            // ── Upload handling ──
            async function handleFiles(files){
                const pdfs = Array.from(files).filter(f=>f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf'));
                if(!pdfs.length) return showToast('Please select PDF files','error');
                showProgress(`Loading ${pdfs.length} file(s)...`,5);
                for(let i=0;i<pdfs.length;i++){
                    try{ await loadPDFFile(pdfs[i]); }catch(e){ showToast(`Failed: ${pdfs[i].name}`,'error'); }
                    showProgress(`Loading... (${i+1}/${pdfs.length})`,5+((i+1)/pdfs.length)*75);
                }
                hideProgress();
                showToast(`Loaded ${pdfs.length} file(s) · ${allPages.length} pages`,'success');
            }

            // ── Modal (unchanged) ──
            function openModal(index){
                if(index<0||index>=allPages.length) return;
                currentPreviewIndex = index;
                pagePreviewModal.style.display='block';
                renderModalPage();
            }
            function closeModal(){
                pagePreviewModal.style.display='none';
                currentPreviewIndex=-1;
                if(modalImage.src && modalImage.src.startsWith('blob:')) URL.revokeObjectURL(modalImage.src);
                modalImage.style.display='none';
                modalLoading.style.display='block';
            }
            async function renderModalPage(){
                if(currentPreviewIndex<0||currentPreviewIndex>=allPages.length) return;
                const pageEntry = allPages[currentPreviewIndex];
                const fileEntry = uploadedFiles.find(f=>f.id===pageEntry.sourceFileId);
                modalTitle.textContent = `Page ${currentPreviewIndex+1} of ${allPages.length} · ${fileEntry?.name||'Unknown'}`;
                modalImage.style.display='none';
                modalLoading.style.display='block';
                modalPrev.disabled = (currentPreviewIndex===0);
                modalNext.disabled = (currentPreviewIndex===allPages.length-1);
                if(!fileEntry||!fileEntry.pdfJsDoc){
                    modalLoading.innerHTML='<i class="fa-solid fa-triangle-exclamation"></i> Preview not available';
                    return;
                }
                try{
                    const page = await fileEntry.pdfJsDoc.getPage(pageEntry.sourcePageNum+1);
                    const scale=1.8;
                    const viewport = page.getViewport({scale});
                    const canvas = document.createElement('canvas');
                    canvas.width=viewport.width;
                    canvas.height=viewport.height;
                    await page.render({canvasContext:canvas.getContext('2d'),viewport}).promise;
                    const blob = await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
                    modalImage.src = URL.createObjectURL(blob);
                    modalImage.style.display='block';
                    modalLoading.style.display='none';
                }catch(e){
                    modalLoading.innerHTML='<i class="fa-solid fa-circle-exclamation"></i> Failed to load preview';
                }
            }
            function navigateModal(direction){
                const newIdx = currentPreviewIndex + direction;
                if(newIdx>=0 && newIdx<allPages.length){
                    if(modalImage.src && modalImage.src.startsWith('blob:')) URL.revokeObjectURL(modalImage.src);
                    currentPreviewIndex = newIdx;
                    renderModalPage();
                }
            }
            modalClose.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', e=>{ if(e.target===modalOverlay) closeModal(); });
            modalPrev.addEventListener('click', ()=>navigateModal(-1));
            modalNext.addEventListener('click', ()=>navigateModal(1));
            document.addEventListener('keydown', e => {
                if(pagePreviewModal.style.display==='block'){
                    if(e.key==='Escape') closeModal();
                    else if(e.key==='ArrowLeft') navigateModal(-1);
                    else if(e.key==='ArrowRight') navigateModal(1);
                }
            });

            // ── Global Events ──
            uploadZone.addEventListener('click', e=>{ if(e.target!==fileInput) fileInput.click(); });
            fileInput.addEventListener('change', e=>{ if(e.target.files.length) handleFiles(e.target.files); fileInput.value=''; });
            uploadZone.addEventListener('dragover', e=>{ e.preventDefault(); uploadZone.classList.add('dragover'); });
            uploadZone.addEventListener('dragleave', ()=>uploadZone.classList.remove('dragover'));
            uploadZone.addEventListener('drop', e=>{
                e.preventDefault();
                uploadZone.classList.remove('dragover');
                if(e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
            });
            document.body.addEventListener('dragover', e=>e.preventDefault());
            document.body.addEventListener('drop', e=>{
                e.preventDefault();
                if(!uploadZone.contains(e.target) && !previewGrid.contains(e.target) && e.dataTransfer.files.length){
                    handleFiles(e.dataTransfer.files);
                }
            });

            mergeBtn.addEventListener('click', mergeAndDownload);
            clearAllBtn.addEventListener('click', clearAllFiles);
            selectAllBtn.addEventListener('click', selectAll);
            deselectAllBtn.addEventListener('click', deselectAll);
            invertSelectionBtn.addEventListener('click', invertSelection);
            removeSelectedBtn.addEventListener('click', removeSelectedPages);
            moveTopBtn.addEventListener('click', ()=>moveSelected('top'));
            moveUpBtn.addEventListener('click', ()=>moveSelected('up'));
            moveDownBtn.addEventListener('click', ()=>moveSelected('down'));
            moveBottomBtn.addEventListener('click', ()=>moveSelected('bottom'));
            resetOrderBtn.addEventListener('click', resetOrder);

            document.addEventListener('keydown', e => {
                if(pagePreviewModal.style.display==='block') return;
                if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
                if((e.ctrlKey||e.metaKey)&&e.key==='a'){ e.preventDefault(); selectAll(); }
                else if((e.ctrlKey||e.metaKey)&&e.key==='d'){ e.preventDefault(); deselectAll(); }
                else if(e.key==='Delete'||e.key==='Backspace'){ e.preventDefault(); removeSelectedPages(); }
                else if((e.ctrlKey||e.metaKey)&&e.key==='m'){ e.preventDefault(); mergeAndDownload(); }
            });

            updateCounters();
            syncGrid();
            renderFileList();
        })();
    </script>
</body>
</html>
